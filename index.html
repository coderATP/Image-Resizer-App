</head><body><div class="container">

    <h2>Image Resizer</h2>

    <div class="section">

        <label class="labelTitle">
            Upload Images
        </label>

        <input
            type="file"
            id="upload"
            accept="image/*"
            multiple
        >

    </div>

    <div class="section sizeRow">

        <div>

            <label id="sizeLabel">
                Width
            </label>

            <input
                type="number"
                id="width"
                placeholder="Width"
            >

        </div>

        <div>

            <label id="sizeLabel">
                Height
            </label>

            <input
                type="number"
                id="height"
                placeholder="Height"
            >

        </div>

    </div>

    <div class="section">

        <label class="checkboxRow">

            <input
                type="checkbox"
                id="aspectRatio"
                checked
            >

            Preserve Aspect Ratio

        </label>

    </div>

    <div class="section">

        <label class="checkboxRow">

            <input
                type="checkbox"
                id="watermarkToggle"
            >

            Add Watermark

        </label>

        <input
            type="text"
            id="watermarkText"
            value="ATP Game Studio"
            placeholder="Watermark text"
            class="watermarkInput"
        >

    </div>

    <div class="section">

        <label class="labelTitle">
            Compression Level
        </label>

        <div class="compressionRow">

            <label>

                <input
                    type="radio"
                    name="compression"
                    value="0.65"
                >

                Light

            </label>

            <label>

                <input
                    type="radio"
                    name="compression"
                    value="0.45"
                >

                Medium

            </label>

            <label>

                <input
                    type="radio"
                    name="compression"
                    value="0.25"
                >

                Strong

            </label>

            <label>

                <input
                    type="radio"
                    name="compression"
                    value="0.05"
                    checked
                >

                Extreme

            </label>

        </div>

    </div>

    <div class="section">

        <label class="labelTitle">
            Download Format
        </label>

        <div class="formatRow">

            <label>

                <input
                    type="radio"
                    name="downloadFormat"
                    value="jpg"
                    checked
                >

                JPG

            </label>

            <label>

                <input
                    type="radio"
                    name="downloadFormat"
                    value="png"
                >

                Transparent PNG

            </label>

        </div>

    </div>

    <div
        class="section"
        id="pngCompressionSection"
        style="display: none;"
    >

        <label class="labelTitle">
            PNG Optimization
        </label>

        <div class="compressionRow">

            <label>

                <input
                    type="radio"
                    name="pngCompression"
                    value="lossless"
                >

                Lossless

            </label>

            <label>

                <input
                    type="radio"
                    name="pngCompression"
                    value="light"
                >

                Light

            </label>

            <label>

                <input
                    type="radio"
                    name="pngCompression"
                    value="strong"
                    checked
                >

                Strong

            </label>

            <label>

                <input
                    type="radio"
                    name="pngCompression"
                    value="extreme"
                >

                Extreme

            </label>

        </div>

    </div>

    <button id="resizeBtn">
        Resize Images
    </button>

    <div
        class="privacyNotice"
        role="note"
        aria-label="Privacy information"
    >

        <strong>
            Privacy
        </strong>

        <p>
            Your images are processed directly in your browser.
            This tool does not upload your selected images to
            ATP Game Studio's servers for resizing or compression.
            For sensitive images, use the tool only on a device and
            browser you trust.
        </p>

    </div>

    <canvas id="canvas"></canvas>

    <div id="downloads"></div>

</div>

<!-- UPNG.js must load BEFORE script.js -->
<script src="pako.js"></script>
<script src="UPNG.js"></script>
<script src="script.js"></script>
